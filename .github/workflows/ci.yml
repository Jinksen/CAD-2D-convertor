name: CI

# Runs scripts/test.ps1 on pull requests, on pushes to main and on demand.
# If Actions is disabled in the repository settings, run .\scripts\test.ps1 locally instead.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: corepack pnpm install --frozen-lockfile
      - shell: powershell
        run: .\scripts\test.ps1
