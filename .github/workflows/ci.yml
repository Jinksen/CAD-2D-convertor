name: CI

# Runs scripts/test.ps1 on pull requests, on pushes to main and on demand.
# If Actions is disabled in the repository settings, run .\scripts\test.ps1 locally instead.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      # Caches the pinned Rune git checkout and compiled dependencies.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/rune-app
      # Backend (ruff, mypy, pytest), cargo fmt/clippy/test for frontend/rune-app (headless, no GPU), Pester.
      - shell: powershell
        run: .\scripts\test.ps1
