[project]
name = "cad2maxwell-backend"
version = "0.1.0"
description = "Local geometry service for CAD2Maxwell"
requires-python = ">=3.12"
dependencies = [
    "cadquery-ocp-novtk>=7.9.3.1.1,<7.10",
    "fastapi>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "cadquery-ocp-stubs>=7.9.3.1.1,<7.10",
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cad2maxwell_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cad2maxwell_backend"]
mypy_path = "src"
