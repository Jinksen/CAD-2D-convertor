[package]
name = "cad2maxwell-desktop"
version = "0.1.0"
description = "CAD2Maxwell desktop host"
authors = ["CAD2Maxwell contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "cad2maxwell_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "cad2maxwell-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = { version = "=0.16.0", default-features = false }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
