      - Release: release.md
      - Research:
          - Format spikes: research/format-spikes.md
          - FreeCAD 3D/2D workflow: research/freecad-3d-2d-workflow.md
  - Plans and specs:
      - UI, settings and formats: superpowers/specs/2026-11-24-ui-settings-formats.md
      - v0.1 completion: superpowers/specs/2026-11-01-v0.1-completion.md
      - UX performance: superpowers/specs/2026-11-01-ux-performance.md
