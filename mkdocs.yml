site_name: CAD2Maxwell
site_description: STEP to Maxwell 2D DXF converter with exact analytic sectioning
repo_url: https://github.com/Jinksen/CAD-2D-convertor
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
theme:
  name: material
  logo: images/logo-dark.svg
  favicon: images/favicon.ico
  features: [navigation.sections, content.code.copy]
exclude_docs: |
  superpowers/plans/
